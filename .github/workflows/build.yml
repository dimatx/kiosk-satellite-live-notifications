name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test production sources and lifecycle
        run: python tools/test.py
      - name: Build developer ZIP
        run: python tools/build.py --android-platform 35 --android-build-tools 35.0.0
      - name: Verify package
        run: python tools/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: live-notifications-developer-package
          path: |
            dist/ks-live-notifications-*.zip
            dist/ks-live-notifications-*.zip.sha256
            dist/kiosk-satellite-plugin.json
          if-no-files-found: error
