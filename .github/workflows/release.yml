name: Release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_TYPE" = tag || { echo "Choose an existing release tag, not a branch."; exit 1; }
          gh release view "$GITHUB_REF_NAME"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test
        run: python tools/test.py
      - name: Build tagged version
        run: python tools/build.py --android-platform 35 --version "${GITHUB_REF_NAME#v}"
      - name: Verify package
        run: python tools/verify_package.py
      - name: Attach verified assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/ks-live-notifications-*.zip \
            dist/ks-live-notifications-*.zip.sha256 \
            dist/kiosk-satellite-plugin.json --clobber
